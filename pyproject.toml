[project]
name = "dsa"
version = "0.1.0"
description = ""
authors = [{ name = "bjarkemoensted", email = "bjarkemoensted@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.4.2",
    "pytest>=8.4.2,<9",
]

[dependency-groups]
dev = [
    "line-profiler>=5.0.2",
    "pytest>=8.4.2,<9",
    "pytest-codeblocks>=0.17.0,<0.18",
    "pytest-mypy>=1.0.1,<2",
    "ruff>=0.15.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
